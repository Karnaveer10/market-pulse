      RetentionInDays: 7

  DeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Telemetry messages are waiting in the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !If [CreateTelemetryQueues, !GetAtt TelemetryDeadLetterQueue.QueueName, !Ref ExistingDeadLetterQueueName]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!If [CreateBudgetAlertsTopic, !Ref BudgetAlertsTopic, !Ref ExistingBudgetAlertsTopicArn]]

  DatabaseCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PostgreSQL CPU has remained above 80 percent
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref TelemetryDatabase
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!If [CreateBudgetAlertsTopic, !Ref BudgetAlertsTopic, !Ref ExistingBudgetAlertsTopicArn]]

Outputs:
  ApiEndpoint:
    Description: Base URL for MarketPulse REST API Gateway
    Value: !Sub "https://${MarketPulseApi}.execute-api.${AWS::Region}.amazonaws.com/v1"
  SQSQueueUrl:
    Description: URL of Amazon SQS Telemetry Queue
    Value: !If [CreateTelemetryQueues, !Ref TelemetryEventQueue, !Ref ExistingTelemetryQueueUrl]
  S3BucketName:
    Description: Name of S3 Bucket for Offline Excel Imports
    Value: !If [CreateOfflineImportBucket, !Ref OfflineImportBucket, !Ref ExistingImportBucketName]
  SNSTopicArn:
    Description: ARN of SNS Budget Alerts Topic
    Value: !If [CreateBudgetAlertsTopic, !Ref BudgetAlertsTopic, !Ref ExistingBudgetAlertsTopicArn]
  UserPoolId:
    Description: Cognito User Pool ID for web authentication
    Value: !Ref MarketPulseUserPool
  UserPoolClientId:
    Description: Cognito public web client ID
    Value: !Ref MarketPulseUserPoolClient
  UserPoolRegion:
    Description: Cognito region
    Value: !Ref AWS::Region
  DatabaseEndpoint:
    Description: PostgreSQL endpoint address
    Value: !GetAtt TelemetryDatabase.Endpoint.Address
  RedisEndpoint:
    Description: Redis primary endpoint address
    Value: !GetAtt TelemetryCache.PrimaryEndPoint.Address
  WebBucketName:
    Description: Private S3 bucket for CloudFront web assets
    Value: !Ref WebBucket
  Ec2InstanceId:
    Description: EC2 demo host instance ID (managed through Systems Manager)
    Value: !Ref Ec2DemoInstance
  Ec2PublicUrl:
    Description: HTTP URL for the EC2 demo host
    Value: !Sub 'http://${Ec2DemoInstance.PublicDnsName}'
